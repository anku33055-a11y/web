<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankitha - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f3e6d3;
            color: #4b2e1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 90%;
            max-width: 650px;
            background: #fffaf3;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(75, 46, 31, 0.25);
            border: 3px solid #8b5e3c;
        }

        .profile h1 {
            font-size: 42px;
            color: #6b3f25;
            margin-bottom: 10px;
        }

        .profile h2 {
            font-size: 22px;
            color: #9a6a47;
            margin-bottom: 25px;
        }

        .profile p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .interests {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .interest {
            background: #8b5e3c;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 17px;
        }

        .footer {
            margin-top: 30px;
            color: #9a6a47;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="profile">
        <h1>🤎 Ankitha 🤎</h1>
        <h2>My Personal Profile</h2>

        <p>Hello everyone! My name is <strong>Ankitha</strong>.</p>

        <p>
            I am currently pursuing my Engineering degree in
            <strong>Computer Science</strong>.
        </p>

        <p>
            I am a <strong>2nd year</strong> student who enjoys
            learning new things and developing my skills.
        </p>

        <div class="interests">
            <div class="interest">📚 I Like Books</div>
            <div class="interest">👩‍🏫 I Like Teaching</div>
        </div>

        <div class="footer">
            "Learning never stops." 🤎
        </div>
    </div>

</body>
</html>
